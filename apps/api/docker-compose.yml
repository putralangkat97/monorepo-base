name: monorepo
networks:
  monorepo:
    name: monorepo
services:
  monorepo-postgres:
    image: postgres
    hostname: postgres
    container_name: monorepo-postgres
    ports:
      - '5433:5432'
    volumes: ['monorepo-postgres:/var/lib/postgresql/data']
    networks: ['monorepo']
    environment:
      POSTGRES_USER: moon
      POSTGRES_PASSWORD: moon
      POSTGRES_DB: task_moon
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      start_period: 10s
volumes:
  monorepo-postgres:
